# Keeps Dependabot pull requests moving: merges them once checks pass and
# gets the failing ones fixed. The logic lives in danieltyukov/dependabot-autopilot.
name: dependabot-autopilot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# The most any autopilot job gets; each job narrows it. No id-token.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write
  pages: write

concurrency:
  group: dependabot-autopilot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  autopilot:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    uses: danieltyukov/dependabot-autopilot/.github/workflows/autopilot.yml@main
    # Only the Claude token is passed on, never the rest of the repository's secrets.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
